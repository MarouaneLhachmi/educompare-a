[pytest]
testpaths = tests
pythonpath = .

# Les tests d'ancrage executent la chaine complete des neuf agents sur le
# corpus de reference : plusieurs dizaines de secondes par document. Ils sont
# donc exclus de la commande par defaut, et lances explicitement :
#     pytest -m lent
addopts = -m "not lent" --strict-markers

markers =
    lent: execute le pipeline complet (chargement du modele semantique inclus)
    ancrage: test de non-regression sur intervalle mesure
