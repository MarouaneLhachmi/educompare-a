{% extends "base.html" %}
{% block titre %}{{ code }} — {{ titre }}{% endblock %}

{% block contenu %}
<div class="conteneur" style="max-width:640px">
    <section class="carte centre anim-monter" style="padding:var(--sp-8) var(--sp-5)">
        <div class="compteur-global">{{ code }}</div>
        <h1 style="margin-top:var(--sp-4)">{{ titre }}</h1>
        <p class="muet">{{ message }}</p>
        <div class="ligne" style="justify-content:center;margin-top:var(--sp-5)">
            <a class="btn btn-primaire" href="{{ url_for('main.accueil') }}">Retour à l'accueil</a>
            {% if utilisateur_courant %}
            <a class="btn btn-secondaire" href="{{ url_for('dashboard.tableau_de_bord') }}">Mon tableau de bord</a>
            {% endif %}
        </div>
    </section>
</div>
{% endblock %}
